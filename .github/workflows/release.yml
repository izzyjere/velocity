name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR or vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if [[ "$VERSION" == "0.0.1" ]]; then VERSION_CODE=1; fi
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Calculated Android versionCode is out of range" >&2
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          VELOCITY_KEYSTORE_BASE64: ${{ secrets.VELOCITY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$VELOCITY_KEYSTORE_BASE64"
          printf '%s' "$VELOCITY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velocity-release.jks"
          chmod 600 "$RUNNER_TEMP/velocity-release.jks"

      - name: Test and build signed release
        env:
          VELOCITY_SIGNING_STORE_FILE: ${{ runner.temp }}/velocity-release.jks
          VELOCITY_SIGNING_STORE_PASSWORD: ${{ secrets.VELOCITY_SIGNING_STORE_PASSWORD }}
          VELOCITY_SIGNING_KEY_ALIAS: ${{ secrets.VELOCITY_SIGNING_KEY_ALIAS }}
          VELOCITY_SIGNING_KEY_PASSWORD: ${{ secrets.VELOCITY_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon verifyReleaseSigningConfiguration testDebugUnitTest lintDebug assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify and name signed APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          NAME="velocity-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/${{ steps.artifact.outputs.name }}" \
            "dist/${{ steps.artifact.outputs.name }}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Velocity ${{ steps.version.outputs.name }}" \
            --notes "Signed Android APK: [${{ steps.artifact.outputs.name }}](${{ steps.artifact.outputs.url }})"

      - name: Update README release link
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.version.outputs.name }}
          APK_NAME: ${{ steps.artifact.outputs.name }}
          APK_URL: ${{ steps.artifact.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag checkout is detached; README edits land on the default branch.
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          CURRENT="$(sed -n 's/^\*\*Current release: v\([^*]*\)\*\*$/\1/p' README.md | head -n 1)"
          if [[ -n "$CURRENT" && "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "README already advertises v$CURRENT, newer than v$VERSION; leaving it unchanged."
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          block = (
              "<!-- release:start (updated automatically by .github/workflows/release.yml) -->\n"
              f"**Current release: v{os.environ['VERSION']}**\n\n"
              f"[Download {os.environ['APK_NAME']}]({os.environ['APK_URL']})\n"
              "<!-- release:end -->"
          )
          with open("README.md", encoding="utf-8") as f:
              text = f.read()
          updated, count = re.subn(r"<!-- release:start.*?<!-- release:end -->", lambda _: block, text, flags=re.S)
          if count != 1:
              raise SystemExit("README.md must contain exactly one release:start/release:end block")
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY
          if git diff --quiet -- README.md; then
            echo "README already points at v$VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README for v$VERSION" -- README.md
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Publish download link
        shell: bash
        run: |
          echo "### Velocity ${{ steps.version.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download ${{ steps.artifact.outputs.name }}](${{ steps.artifact.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
